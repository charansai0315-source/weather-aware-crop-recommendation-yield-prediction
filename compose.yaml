services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fieldwise}
      MYSQL_USER: ${DB_USERNAME:-fieldwise}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fieldwise_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fieldwise_root_dev_only}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-fieldwise}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-fieldwise}
      DB_PASSWORD: ${DB_PASSWORD:-fieldwise_dev_only}
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy

volumes:
  mysql-data:
